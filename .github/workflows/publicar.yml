name: Publicar en Instagram
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: publicar
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publicar lo pendiente
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python3 Robot/publicar.py
      - name: Guardar estado de la cola
        run: |
          git config user.name "Robot Spartans"
          git config user.email "robot@users.noreply.github.com"
          git add Robot/cola.json
          git diff --cached --quiet || (git commit -m "Robot: estado de publicaciones" && git pull --rebase && git push)
