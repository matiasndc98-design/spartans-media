name: Renovar token de Instagram
on:
  schedule:
    - cron: '17 12 * * 1'
  workflow_dispatch:
jobs:
  renovar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Renovar
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: python3 Robot/renovar_token.py
